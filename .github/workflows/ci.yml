name: CI Build & Container Smoke Test

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build & Validate Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: sql-sf-ops-console:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Container startup smoke test
        run: |
          # Generate a throwaway RSA-256 keypair for local auth verification test
          mkdir -p keys
          openssl genrsa -out keys/private.key 2048
          openssl rsa -in keys/private.key -pubout -out keys/public.key

          # Run container detached with mock environment
          docker run -d --name ops-console-smoke \
            -p 3001:3001 \
            -e PORT=3001 \
            -e AUTH_PROVIDER=local \
            -e JWT_PUBLIC_KEY_PATH=/app/keys/public.key \
            -v "$(pwd)/keys:/app/keys:ro" \
            -v "$(pwd)/servers.example.csv:/app/servers.csv:ro" \
            sql-sf-ops-console:test

          # Allow container 5 seconds to boot
          sleep 5

          # Verify container is still running
          if [ "$(docker inspect -f '{{.State.Running}}' ops-console-smoke)" != "true" ]; then
            echo "Container exited unexpectedly!"
            docker logs ops-console-smoke
            exit 1
          fi

          # Hit unauthenticated health endpoint (should return 200 or 401, not 502/connection failure)
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3001/api/health || true)
          echo "Health endpoint returned HTTP: $HTTP_STATUS"

          # Clean up smoke container
          docker rm -f ops-console-smoke
